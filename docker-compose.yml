services:
  projectx-frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_API_TIMEOUT: ${VITE_API_TIMEOUT}
        VITE_APP_NAME: ${VITE_APP_NAME}
        VITE_APP_VERSION: ${VITE_APP_VERSION}
        VITE_ENV: ${VITE_ENV}
        VITE_CSRF_TOKEN_KEY: ${VITE_CSRF_TOKEN_KEY}
        VITE_ENABLE_DEBUG: ${VITE_ENABLE_DEBUG}
    ports:
      - "80:80"
    networks:
      - projectx-network

networks:
  projectx-network:
    external: true
